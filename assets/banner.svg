<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.2) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(450px); opacity: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes floatPill4 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .orb-cyan { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-purple { animation: pulseOrb2 10s ease-in-out infinite; }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill3 5.5s ease-in-out infinite 0.5s; }
    .pill-4 { animation: floatPill4 6.5s ease-in-out infinite 1.5s; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Background Orbs -->
  <circle cx="180" cy="120" r="140" fill="#0284c7" filter="url(#glowCyan)" class="orb-cyan" opacity="0.4" />
  <circle cx="1020" cy="280" r="160" fill="#7c3aed" filter="url(#glowPurple)" class="orb-purple" opacity="0.35" />
  <circle cx="600" cy="380" r="100" fill="#0d9488" filter="url(#glowCyan)" class="orb-cyan" opacity="0.25" />

  <!-- Animated subtle light beam in background -->
  <line x1="50" y1="0" x2="1150" y2="0" stroke="url(#accentCyan)" stroke-width="2" opacity="0.3" class="pill-1">
    <animateTransform attributeName="transform" type="translate" values="0,-50; 0,450; 0,-50" dur="12s" repeatCount="indefinite" />
  </line>

  <!-- Central Content Frame (Title and Subtitle in Absolute Crisp Foreground) -->
  <g class="font-sans">
    <!-- Category Badge -->
    <g transform="translate(450, 48)">
      <rect width="300" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="20" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="21" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.5">REVOPS &amp; DATA QUALITY</text>
    </g>

    <!-- Main Title (Foreground) -->
    <text x="600" y="135" text-anchor="middle" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome CRM Data Hygiene &amp; Validation
    </text>

    <!-- Subtitle (Foreground) -->
    <text x="600" y="175" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="500" letter-spacing="0.2">
      Curated Standards, Enterprise SaaS Platforms &amp; Open-Source Hygiene Primitives
    </text>

    <text x="600" y="202" text-anchor="middle" fill="#64748b" font-size="14" font-weight="400">
      Address Normalization • Real-Time Email Deliverability • Deduplication &amp; Entity Resolution • Master Data Hygiene
    </text>

    <!-- Dynamic Interactive Feature Pills (Foreground Cards floating gently) -->
    <g transform="translate(100, 245)">
      <!-- Pill 1 -->
      <g class="pill-1" transform="translate(0, 0)">
        <rect width="230" height="90" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="36" cy="34" r="14" fill="#0369a1" />
        <text x="36" y="40" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">🔍</text>
        <text x="62" y="38" fill="#f8fafc" font-size="15" font-weight="700">Deduplication</text>
        <text x="24" y="66" fill="#94a3b8" font-size="12">Probabilistic entity matching</text>
        <text x="24" y="80" fill="#64748b" font-size="11">Splink, Dedupe, RecordLinkage</text>
      </g>

      <!-- Pill 2 -->
      <g class="pill-2" transform="translate(255, 0)">
        <rect width="230" height="90" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="36" cy="34" r="14" fill="#4338ca" />
        <text x="36" y="40" text-anchor="middle" fill="#818cf8" font-size="16" font-weight="bold">📍</text>
        <text x="62" y="38" fill="#f8fafc" font-size="15" font-weight="700">Postal Validation</text>
        <text x="24" y="66" fill="#94a3b8" font-size="12">CASS/DPV, global parsing</text>
        <text x="24" y="80" fill="#64748b" font-size="11">libpostal, libaddressinput</text>
      </g>

      <!-- Pill 3 -->
      <g class="pill-3" transform="translate(510, 0)">
        <rect width="230" height="90" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="36" cy="34" r="14" fill="#7e22ce" />
        <text x="36" y="40" text-anchor="middle" fill="#c084fc" font-size="16" font-weight="bold">⚡</text>
        <text x="62" y="38" fill="#f8fafc" font-size="15" font-weight="700">Contact Quality</text>
        <text x="24" y="66" fill="#94a3b8" font-size="12">Phone &amp; email deliverability</text>
        <text x="24" y="80" fill="#64748b" font-size="11">libphonenumber, email-validator</text>
      </g>

      <!-- Pill 4 -->
      <g class="pill-4" transform="translate(765, 0)">
        <rect width="235" height="90" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="36" cy="34" r="14" fill="#047857" />
        <text x="36" y="40" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">🛡️</text>
        <text x="62" y="38" fill="#f8fafc" font-size="15" font-weight="700">Data Testing</text>
        <text x="24" y="66" fill="#94a3b8" font-size="12">Pipeline assertion &amp; profiling</text>
        <text x="24" y="80" fill="#64748b" font-size="11">Great Expectations, AI audits</text>
      </g>
    </g>

    <!-- Bottom Tech Sub-bar -->
    <g transform="translate(0, 395)">
      <line x1="200" y1="0" x2="1000" y2="0" stroke="#334155" stroke-dasharray="4 4" />
      <text x="600" y="16" text-anchor="middle" fill="#64748b" font-size="12" font-weight="500">
        Compatible with Salesforce, HubSpot, Dynamics 365, Marketo, Snowflake &amp; Modern Data Warehouses
      </text>
    </g>
  </g>
</svg>
